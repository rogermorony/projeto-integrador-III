<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Categorias | Serra Verde</title>

    <link rel="icon" type="image/png" href="../src/assets/logo-serra-verde.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                Serra Verde | Categorias
            </a>

            <a href="index.html" class="btn btn-outline-light">
                Voltar ao painel
            </a>
        </div>
    </nav>

    <main class="container py-5">

        <div class="mb-4">
            <h1 class="h2">Gerenciamento de categorias</h1>

            <p class="text-secondary">
                Cadastre e consulte as categorias dos produtos.
            </p>
        </div>

        <div id="mensagem-categoria" class="alert d-none" role="status" aria-live="polite">
        </div>

        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="h5 mb-3">Nova categoria</h2>

                <form id="form-categoria">
                    <input type="hidden" id="categoria-id">
                    <div class="row g-3">

                        <div class="col-12 col-md-4">
                            <label for="nome-categoria" class="form-label">
                                Nome
                            </label>

                            <input type="text" id="nome-categoria" class="form-control" required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="descricao-categoria" class="form-label">
                                Descrição
                            </label>

                            <input type="text" id="descricao-categoria" class="form-control" required>
                        </div>

                        <div class="col-12 col-md-2">
                            <label class="form-label d-block">
                                Situação
                            </label>

                            <div class="form-check form-switch pt-2">
                                <input type="checkbox" id="categoria-ativa" class="form-check-input" checked>

                                <label for="categoria-ativa" class="form-check-label">
                                    Ativa
                                </label>
                            </div>
                        </div>

                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" id="botao-salvar-categoria" class="btn btn-success">
                            Cadastrar categoria
                        </button>

                        <button type="button" id="botao-cancelar-edicao" class="btn btn-outline-secondary d-none">
                            Cancelar edição
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <section class="card shadow-sm">
            <div class="card-body">
                <h2 class="h5 mb-3">Categorias cadastradas</h2>

                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-success">
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Descrição</th>
                                <th>Situação</th>
                                <th>Ações</th>
                            </tr>
                        </thead>

                        <tbody id="tabela-categorias"></tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../src/js/dados.js"></script>
    <script src="../src/js/storage.js"></script>
    <script src="../src/js/admin-categorias.js"></script>

</body>

</html>
